name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: daemon (lint + test)
    # Unix domain sockets (the daemon's whole transport) work the same way on
    # Linux; nothing here is macOS-specific, so this doesn't need the pricier
    # macOS runner — only the desktop job, which builds/tests the actual macOS
    # target shell, does.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    # `daemon/pyproject.toml`'s `worker` dependency-group (hermes-agent, needed only
    # to run a *real* worker subprocess — every test here uses a stdlib fake ACP
    # agent instead, see that group's comment) points `[tool.uv.sources]` at a
    # machine-local editable checkout that doesn't exist on this runner. It's
    # excluded from `default-groups` so a plain `uv sync`/`uv run` never needs to
    # install it — but `uv` still validates/re-resolves the *full* lock (every
    # group, installed or not) before an unqualified `sync`/`run`, which touches
    # that path regardless. `--frozen` skips that revalidation and trusts the
    # committed `uv.lock` as-is; `UV_FROZEN` applies it to every `uv` invocation
    # below without repeating the flag on each step (round-1 review fix — see the
    # PR report's "第 1 轮修复记录").
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest -q

  desktop:
    name: desktop (lint + typecheck + test)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: tsc
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: build
        run: pnpm build
      - name: smoke (real Electron launch, sandboxed preload)
        # macos-14 runners have a real WindowServer (unlike Linux CI), so an
        # off-screen (`show: false`) BrowserWindow launches without a virtual
        # display — no xvfb-equivalent needed here.
        run: pnpm smoke
      # 02-w3-interfaces.md §2 集成收口 #4: `pnpm e2e` spawns a REAL daemon
      # (scripts/e2e.mjs imports the real out/main/index.js and lets its own
      # ensureDaemonRunning() spawn `uv run python -m jones_daemon`) — this job
      # needs uv + Python 3.12 for that, same as the `daemon` job above (see its
      # comment for why UV_FROZEN=1 is required on every `uv` invocation: the
      # `worker` dependency group's `[tool.uv.sources]` points at a machine-local
      # hermes-agent checkout this runner doesn't have, and only `--frozen`
      # avoids re-resolving that group at all).
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: e2e (real daemon + real Electron, no provider Key configured)
        env:
          UV_FROZEN: "1"
        run: pnpm e2e
