name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: daemon (lint + test)
    # Unix domain sockets (the daemon's whole transport) work the same way on
    # Linux; nothing here is macOS-specific, so this doesn't need the pricier
    # macOS runner — only the desktop job, which builds/tests the actual macOS
    # target shell, does.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest -q

  desktop:
    name: desktop (lint + typecheck + test)
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: tsc
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      - name: build
        run: pnpm build
