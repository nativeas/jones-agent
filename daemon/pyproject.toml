[project]
name = "jones-daemon"
version = "0.1.0"
description = "Jones Agent local daemon (RPC server, storage, session/worker orchestration)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jones_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# spikes/ 是一次性技术验证脚本，不是产品代码，不纳入 lint / 包 / 测试收集
exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
