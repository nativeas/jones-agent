[project]
name = "jones-daemon"
version = "0.1.0"
description = "Jones Agent local daemon (RPC server, storage, session/worker orchestration)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Floor relaxed from >=50.0.1 (B/#7's original `uv add` pin) to >=50.0.0: Hermes
    # exact-pins every direct dependency (its own pyproject.toml's stated supply-chain
    # policy) at `cryptography==50.0.0`, and A/#10 adds hermes-agent as a real
    # dependency below — >=50.0.1 is otherwise unresolvable against that exact pin.
    # 50.0.0 has every primitive B's vault.py uses (AESGCM has been stable for
    # years); see this PR's report "契约变更" section.
    "cryptography>=50.0.0",
    "keyring>=25.7.0",
    # Worker subprocesses run `python -m acp_adapter.entry` (Hermes's own ACP
    # server) in the *daemon's own* interpreter/venv (WorkerManager spawns
    # `sys.executable -m acp_adapter.entry`), so hermes-agent must be a real
    # daemon dependency, not just a dev-time convenience. Pinned to the exact
    # commit 01-w2-interfaces.md §2 names (`ee4452991d17534aa561f31ee55596d082aa94e7`)
    # via a git direct reference — PyPI's newest published release at the time of
    # this pin (0.19.0, checked 2026-09-19) is older than that commit's own
    # `version = "0.21.2"`, i.e. this commit isn't on PyPI yet, so a git reference
    # is the only reproducible remote pin available (the alternative, a local path
    # dependency on /Users/nativeas/.hermes/hermes-agent, is explicitly ruled out
    # by 01-w2-interfaces.md §2 for the *committed* pyproject — "本机...可作为 uv
    # 的本地 path 依赖做开发验证，但提交的 pyproject 必须是可复现的远端引用").
    # `[acp]` extra pulls in `agent-client-protocol==0.9.0`, which this repo's own
    # `kernel/acp_client.py` was hand-written against (its module docstring) but
    # does not import — the extra is here so the worker subprocess's own `import
    # acp` (inside acp_adapter) resolves, not because the daemon imports it.
    "hermes-agent[acp]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jones_daemon"]

# Required for the hermes-agent git direct reference above — hatchling refuses to
# build a package whose declared dependencies include a non-PyPI direct reference
# unless this is explicitly opted into (it's PEP 508 direct references in general
# it's cautious about, not git specifically; ours is a pinned commit, not a moving
# target, so the reproducibility hatchling is protecting against isn't at risk here).
[tool.hatch.metadata]
allow-direct-references = true

# See the PR report's "契约变更" section and docs/design/01-w2-interfaces.md §2's
# updated note for the full story — short version: hermes-agent's own setup.py
# hard-refuses a normal (non-editable) build ("Building wheels or sdists for
# hermes-agent is not supported... use an editable install instead" — confirmed
# by actually running `uv sync` against a plain `hermes-agent[acp] @
# git+https://...@ee445299...` dependency and hitting that RuntimeError, not a
# guess), and `uv`'s `[tool.uv.sources]` refuses `git` + `editable` together
# ("cannot specify both `git` and `editable`", also confirmed by running it) —
# so a *remote* editable reference isn't expressible at all, only a local path
# one is. This machine's pinned checkout happens to already be the exact commit
# 01-w2-interfaces.md §2 names, which is what makes this line reproducible on
# *this* machine, but it is not a portable remote reference — a real
# CI/another-contributor's machine needs its own checkout of the same commit at
# this same path, or this line updated to point at theirs.
[tool.uv.sources]
hermes-agent = { path = "/Users/nativeas/.hermes/hermes-agent", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# spikes/ 是一次性技术验证脚本，不是产品代码，不纳入 lint / 包 / 测试收集
exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
