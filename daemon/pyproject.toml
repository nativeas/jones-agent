[project]
name = "jones-daemon"
version = "0.1.0"
description = "Jones Agent local daemon (RPC server, storage, session/worker orchestration)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Floor relaxed from >=50.0.1 (B/#7's original `uv add` pin) to >=50.0.0: Hermes
    # exact-pins every direct dependency (its own pyproject.toml's stated supply-chain
    # policy) at `cryptography==50.0.0`, and the `worker` dependency-group below adds
    # hermes-agent — >=50.0.1 is otherwise unresolvable against that exact pin.
    # 50.0.0 has every primitive B's vault.py uses (AESGCM has been stable for
    # years); see this PR's report "契约变更" section.
    "cryptography>=50.0.0",
    "keyring>=25.7.0",
    "pyyaml>=6.0",
    # Issue #41 (G09 orphan-process fallback, `workers/manager.py::
    # snapshot_worker_descendants`): was only ever installed transitively,
    # via the `worker` dependency group's `hermes-agent[acp]` pin — never a
    # direct dependency of this package even though `workers/manager.py`
    # imports it unconditionally (every `uv sync`/CI run, not just `--group
    # worker`). `psutil.Process(pid).children(recursive=True)` is the
    # cross-platform way to walk a real process tree (v1.1 needs this to
    # also work on Windows, PRD 11 G18) — hand-parsing `ps` output was the
    # other option DEV.md 工程原则 #6 would otherwise favor avoiding a new
    # dependency for, but `ps`'s column semantics genuinely differ between
    # macOS and Linux and parsing it can't disambiguate a reused pid the way
    # `create_time()` here does — that complexity is exactly what a
    # dependency should absorb, not what this package should reinvent.
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# NOT installed by a plain `uv sync` (uv only installs `dev` by default; see
# `[tool.uv] default-groups` below, which pins that explicitly rather than relying
# on uv's own default so this stays true even if uv's default ever changes) — see
# below for why. Opt in with `uv sync --group worker` (needs the machine to have
# hermes-agent's checkout at the path in `[tool.uv.sources]` below, or that path
# updated to point at yours — see that section's comment); CI never opts in, see
# `[tool.uv] default-groups`'s comment for why a plain `uv sync`/`uv run` alone
# still isn't the whole fix.
worker = [
    # Worker subprocesses run `python -m acp_adapter.entry` (Hermes's own ACP
    # server) in the *daemon's own* interpreter/venv (WorkerManager spawns
    # `sys.executable -m acp_adapter.entry`), so a real hermes-agent install is
    # needed to actually run a worker against a real user — but nothing under
    # `src/jones_daemon` imports it (`workers/manager.py` only ever shells out to
    # `sys.executable -m acp_adapter.entry`, never `import acp_adapter`), and
    # every one of this package's 128 tests injects `worker_cmd=[...,
    # "fake_acp_agent.py"]` (pure stdlib, see that file) instead of spawning the
    # real thing — `tests/integration/test_real_hermes_e2e.py` is the one
    # exception, and it's already double-gated behind `JONES_E2E=1` +
    # `ANTHROPIC_API_KEY` and skips itself when hermes-agent isn't importable.
    # Version pinned (not a bare `hermes-agent[acp]`) to at least lock down the
    # metadata half of 01-w2-interfaces.md §2's "锁到 commit" even though the
    # resolvable-source half remains unsolved (see the comment on
    # `[tool.uv.sources]` below) — `ee4452991d17534aa561f31ee55596d082aa94e7`
    # self-reports `version = "0.21.2"` in its own pyproject.toml.
    "hermes-agent[acp]==0.21.2",
    # Issue #17/FR13 (03-w4-interfaces.md §2): source-verified (`tools/mcp_tool.py`'s
    # `_ensure_mcp_sdk()`) that Hermes's MCP client support is gated on the `mcp`
    # PyPI package being importable, but hermes-agent's own `[acp]` extra does NOT
    # pull it in — only hermes-agent's OWN `dev` extra does (its pyproject.toml,
    # `dev = [..., "mcp==2.0.0", ...]`). Without this, `uv sync --group worker`
    # alone leaves `tests/integration/test_mcp_e2e.py` unable to register ANY MCP
    # server ("MCP SDK not available -- skipping explicit MCP registration", a
    # silent empty-list return, not an error — reproduced against this exact
    # checkout before adding this line). Pinned to the same version hermes-agent's
    # own `dev` extra uses, for the same "install exactly what that commit was
    # built/tested against" reason `hermes-agent[acp]==0.21.2` above is pinned.
    "mcp==2.0.0",
]

[tool.uv]
# Round-1 review fix (see this PR's report "第 1 轮修复记录"). `worker` is
# excluded from the default groups so `uv sync`/`uv run` only ever *install*
# `dev` (pytest/ruff, both on PyPI) by default — but that alone is NOT enough
# for CI: an unqualified `uv sync`/`uv run` still re-resolves the *full* lock
# (every group, installed or not) first, which touches hermes-agent's
# `[tool.uv.sources]` path regardless of `default-groups` (confirmed by
# actually running it against a nonexistent path — same
# `error: Distribution not found` as before this fix). `--frozen` (or the
# `UV_FROZEN=1` env var CI sets — see `.github/workflows/ci.yml`'s daemon job)
# is what actually skips that re-resolution and trusts the committed
# `uv.lock` as-is; `default-groups` here is what makes a *plain* `uv sync` on
# a machine that already has (or doesn't need) hermes-agent still only
# *install* `dev` by default.
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jones_daemon"]

# hermes-agent (in the `worker` group above, not `dependencies`) is a path
# dependency, which counts as a "direct reference" to hatchling the same way a git
# URL would — this stays opted in regardless.
[tool.hatch.metadata]
allow-direct-references = true

# See the PR report's "契约变更" and "第 1 轮修复记录" sections and
# docs/design/01-w2-interfaces.md §2/§2.1 for the full story — short version:
# hermes-agent's own setup.py hard-refuses a normal (non-editable) build
# ("Building wheels or sdists for hermes-agent is not supported... use an
# editable install instead" — confirmed by actually running `uv sync` against a
# plain `hermes-agent[acp] @ git+https://...@ee445299...` dependency and hitting
# that RuntimeError, not a guess), and `uv`'s `[tool.uv.sources]` refuses `git` +
# `editable` together ("cannot specify both `git` and `editable`", also confirmed
# by running it) — so a *remote* editable reference isn't expressible at all,
# only a local path one is, and PyPI doesn't have this commit either (see the
# `worker` group's comment). This is still not a portable reference — a
# contributor who runs `uv sync --group worker` needs their own checkout of the
# pinned commit at this same path, or this line updated to point at theirs — but
# unlike round 1, that unsolved cost now only lands on someone who explicitly
# opts into real-worker development, never on `uv sync`/CI/every other branch's
# daemon job.
[tool.uv.sources]
hermes-agent = { path = "/Users/nativeas/.hermes/hermes-agent", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# spikes/ 是一次性技术验证脚本，不是产品代码，不纳入 lint / 包 / 测试收集
exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
